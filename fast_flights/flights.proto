syntax = "proto3";

message Airport {
  string airport = 2;
}

message FlightData {
  string date = 2;
  optional uint32 departure_min_hour = 8; // if min departure time is 01:00AM, this number will be 1
  optional uint32 departure_max_hour = 9; // if max departure time is 16:00AM, this number will be 15, i.e one less
  optional uint32 arrival_min_hour = 10; // same rules as departure
  optional uint32 arrival_max_hour = 11; // same rules as departure
  optional uint32 max_flight_duration_minutes = 12;
  repeated Airport from_flight = 13;
  repeated Airport to_flight = 14;
  repeated string connecting_airport = 15; 
  optional int32 max_stops = 5;
  repeated string airlines = 6;
  optional uint32 min_connection_time_minutes = 17;
  optional uint32 max_connection_time_minutes = 18;
  optional bool less_emissions = 19;
}

enum Seat {
  UNKNOWN_SEAT = 0;
  ECONOMY = 1;
  PREMIUM_ECONOMY = 2;
  BUSINESS = 3;
  FIRST = 4;
}

enum Trip {
  UNKNOWN_TRIP = 0;
  ROUND_TRIP = 1;
  ONE_WAY = 2;
  MULTI_CITY = 3; // not implemented
}

enum Passenger {
  UNKNOWN_PASSENGER = 0;
  ADULT = 1;
  CHILD = 2;
  INFANT_IN_SEAT = 3;
  INFANT_ON_LAP  = 4;
}

message Bags {
  int32 carry_on_bags = 2;
  int32 unknown = 3;
}

message Info {
  repeated FlightData data = 3;
  Seat seat = 9;
  repeated Passenger passengers = 8;
  optional int32 max_price = 12;
  optional Bags bags = 13;
  optional bool no_self_transfer = 17;
  Trip trip = 19;
}

message Price {
  int32 price = 1;
  string currency = 3;
}

message ItinerarySummary {
  string flights = 2;
  Price price = 3;
}
